<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10150e">
  <title>Field / Blob Tracking</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="node_modules/lucide/dist/umd/lucide.js"></script>
  <script defer src="node_modules/tracking/build/tracking-min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <canvas id="scene" aria-label="Animated forest with live blob tracking overlays"></canvas>
    <header>
      <div class="identity"><span class="mark">+</span><h1>FIELD<span> / 001</span></h1></div>
      <div class="live"><span class="dot"></span><span id="status">INITIALIZING</span></div>
      <button id="fullscreen" class="icon-button" title="Toggle fullscreen" aria-label="Toggle fullscreen"><i data-lucide="maximize"></i></button>
    </header>
    <aside class="telemetry" aria-label="Tracking statistics"><span>COLOR / CONNECTED COMPONENTS</span><span id="metrics">000 REGIONS · 00 FPS</span></aside>
    <div id="notice" role="status" hidden></div>
    <footer>
      <div class="caption"><h2>Foliage study</h2><span>REAL-TIME BLOB TRACKING</span></div>
      <div class="controls">
        <button id="pause" class="icon-button" title="Pause animation" aria-label="Pause animation"><i data-lucide="pause"></i></button>
        <label class="source"><span>SOURCE</span><select id="source" aria-label="Source"><option value="forest">Forest study</option><option value="reference">Reference clip</option><option value="camera">Webcam</option><option value="upload">Open video...</option></select></label>
        <label class="sensitivity"><span>THRESHOLD <output id="threshold-value">98</output></span><input id="threshold" type="range" min="70" max="210" value="98" aria-label="Detection brightness threshold"></label>
        <label class="switch"><input id="boxes" type="checkbox" checked><span>BOXES</span></label>
        <label class="switch"><input id="links" type="checkbox" checked><span>LINKS</span></label>
      </div>
      <div class="coordinates"><span id="time">00:00:00</span><span>EXPERIMENT / 01</span></div>
    </footer>
    <input id="file" type="file" accept="video/*" hidden>
    <video id="video" muted playsinline loop hidden></video>
  </main>
</body>
</html>
