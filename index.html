<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blob Overlay</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    .controls { position: fixed; z-index: 2; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 20px; padding: 10px 14px; background: #000c; border: 1px solid #d3e6af35; border-radius: 3px; color: #e4edcf; font: 9px "Courier New", monospace; }
    .control { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .control input { width: 140px; margin: 0; accent-color: #c9ef9b; cursor: pointer; }
    .control output { width: 3ch; text-align: right; }
    @media (max-width: 600px) {
      .controls { left: 12px; right: 12px; bottom: 12px; gap: 12px; justify-content: space-between; }
      .control { gap: 6px; }
      .control input { width: min(22vw, 110px); }
    }
  </style>
  <script defer src="blob-overlay.js"></script>
</head>
<body>
  <div class="controls">
    <label class="control">BOXES / LINES <input id="count" type="range" min="0" max="300" value="65"><output id="count-value">65</output></label>
    <label class="control">SPEED <input id="speed" type="range" min="0" max="3" step="0.1" value="1"><output id="speed-value">1.0</output></label>
  </div>
  <script>
    addEventListener('DOMContentLoaded', () => {
      const overlay = BlobOverlay.create(document.body, { count: 65 });
      const input = document.querySelector('#count');
      input.addEventListener('input', () => {
        overlay.setCount(input.value);
        document.querySelector('#count-value').value = input.value;
      });
      const speedInput = document.querySelector('#speed');
      speedInput.addEventListener('input', () => {
        overlay.setSpeed(speedInput.value);
        document.querySelector('#speed-value').value = Number(speedInput.value).toFixed(1);
      });
    });
  </script>
</body>
</html>
